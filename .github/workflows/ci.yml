name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Bash syntax
        run: bash -n install.sh
      - name: Run ShellCheck
        run: shellcheck install.sh
      - name: Run installer contract tests
        run: python3 -m unittest -v tests/test_installer.py
